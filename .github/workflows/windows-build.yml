name: Build QUBE TUNE for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows x64 app
        run: dotnet publish QubeTune.Windows/QubeTune.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/QubeTune-win-x64
      - name: Bundle official PresentMon frame capture tool
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GameTechDev/PresentMon/releases/download/v2.6.0/PresentMon-2.6.0-x64.exe" -OutFile "artifacts/QubeTune-win-x64/PresentMon.exe"
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: QUBE-TUNE-Windows-x64
          path: artifacts/QubeTune-win-x64/
          if-no-files-found: error
          retention-days: 14